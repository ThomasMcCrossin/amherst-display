name: Build display JSONs & standings snapshots

on:
  schedule:
    # Run daily at 06:30 UTC (03:30 ADT / 02:30 AST).
    # This updates all data: schedules, standings, rosters, game summaries
    - cron: '30 6 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch: {}
  # Auto-run on script/data changes for testing
  push:
    paths:
      - 'scripts/**'
      - 'teams.json'
      - 'config/hockeytech.json'
      - '.github/workflows/build-jsons.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: central-mhl-metadata
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOCKEYTECH_API_KEY: ${{ secrets.HOCKEYTECH_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Cache Chrome/Chromium that Puppeteer downloads
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Install Chrome for Puppeteer (v23+ no auto-download)
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Build and validate metadata, plan and snapshot (tee logs)
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_all.mjs 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Commit & push if changed
        if: success() && steps.metadata.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          git add games.json next_games.json monitor_plan.json metadata_build.json standings_mhl.json ccmha_games.json league_stats.json games/ rosters/ assets/headshots/ assets/standings/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: nightly JSON & standings snapshot update"
            git push
          fi
