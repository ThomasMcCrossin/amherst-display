<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ramblers Game TV - Hybrid</title>
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><div id="screen">
  <header id="bug">
    <div class="b-team"><div class="disc"><img id="bugLogo" alt=""></div>
      <div><div class="b-name">AMHERST RAMBLERS</div><div class="b-rec" id="bugRec"></div></div></div>
    <div class="b-mid"><div class="b-sec" id="bugSec"></div><div class="dots" id="dots"></div></div>
    <div class="b-next"><div><div class="b-lab" id="bugLab">NEXT GAME</div><div class="b-when" id="bugWhen"></div></div><div class="b-cd" id="bugCd"></div></div>
    <div class="prog"><i id="prog"></i></div>
  </header>
  <main id="stage"></main>
  <div id="wipe"><i></i></div>
  <footer id="foot">
    <div class="tick"><div class="tick-tag">LATEST</div><div class="tick-win" id="tickWin"><div class="tick-run" id="tickRun"></div></div></div>
    <div class="credit" id="credit"></div>
  </footer>
</div><script src="app.js"></script></body></html>
