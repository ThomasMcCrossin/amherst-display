<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ramblers Game TV - Dashboard</title>
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="board">
  <header>
    <img id="hlogo" alt="" width="60" height="60">
    <div class="ht"><b>AMHERST RAMBLERS</b><span id="hsub">Game TV</span></div>
    <div id="clock"></div>
  </header>
  <section class="tile" id="t-next"><div class="th"><h2>Next game</h2><div class="dots" id="d-next"></div></div><div class="tb" id="b-next"></div></section>
  <section class="tile" id="t-stand"><div class="th"><h2 id="h-stand">Standings</h2><div class="dots" id="d-stand"></div></div><div class="tb" id="b-stand"></div></section>
  <section class="tile" id="t-ins"><div class="th"><h2>Insights</h2><div class="dots" id="d-ins"></div></div><div class="tb" id="b-ins"></div></section>
  <section class="tile" id="t-sc"><div class="th"><h2 id="h-sc">Scoring leaders</h2><div class="dots" id="d-sc"></div></div><div class="tb" id="b-sc"></div></section>
  <section class="tile" id="t-res"><div class="th"><h2>Recent results</h2><div class="dots" id="d-res"></div></div><div class="tb" id="b-res"></div></section>
  <footer id="foot"></footer>
</div>
<script src="app.js"></script>
</body></html>
